<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="refresh" content="0; url=/cpg/"/>
<link rel="canonical" href="https://hello-bit-code.github.io/cpg/"/>
<title>카메라 소풍단 연구소 CPG로 이동</title>
<script>
(function(){
  var dest=new URL('/cpg/',location.origin);
  var old=new URLSearchParams(location.search);
  old.forEach(function(v,k){
    if(!/^utm_|^(fbclid|gclid|msclkid)$/i.test(k))dest.searchParams.append(k,v);
  });
  location.replace(dest.pathname+dest.search+location.hash);
})();
</script>
</head>
<body><p>카메라 소풍단 연구소 CPG로 이동합니다. <a href="/cpg/">새 사이트 열기</a></p></body>
</html>
