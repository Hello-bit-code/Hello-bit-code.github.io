<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffe6ee">
<meta name="description" content="조금 떨리지만, 너에게 하고 싶은 말.">
<title>너에게 하고 싶은 말 💌</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E💗%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 15% 10%,#fff8fb,transparent 55%),radial-gradient(ellipse at 90% 95%,#ffc4d5,transparent 65%),#ffe6ee;color:#502938;font-family:ui-rounded,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{width:min(100%,540px);text-align:center} .eyebrow{font-size:12px;letter-spacing:.24em;font-weight:700;color:#986273;margin:0 0 24px}
.card{position:relative;border:1px solid #fff;background:#fffafbed;border-radius:32px;padding:44px 28px 30px;box-shadow:0 24px 80px #ad406b18,0 3px 10px #ad406b08}
.stamp{position:absolute;right:24px;top:22px;color:#d7527c;transform:rotate(12deg);font-size:24px}
.character{font-size:100px;line-height:1.35;display:block;filter:drop-shadow(0 8px 10px #b66b3a18);animation:bob 3s ease-in-out infinite;margin:8px 0 22px}
h1{font-size:clamp(28px,6vw,38px);line-height:1.4;letter-spacing:-.055em;margin:0 0 12px;word-break:keep-all}
.subtitle{font-size:16px;line-height:1.7;color:#946477;margin:0}
.buttons{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;min-height:110px;margin-top:25px}
button{font:inherit;cursor:pointer;border:0;min-height:48px;border-radius:999px;padding:15px 30px;font-weight:700;transition:background .2s,font-size .25s,padding .25s;max-width:100%;overflow-wrap:anywhere}
button:focus-visible{outline:3px solid #72374c;outline-offset:5px}#yes{background:#e94077;color:white;font-size:20px;box-shadow:0 8px 20px #e9407730}#yes:hover{background:#d83269}#no{background:#f3edf0;color:#785965;font-size:16px}
.note{font-size:14px;line-height:1.6;color:#9a7583;min-height:24px;margin:18px 0 0}
footer{font-size:12px;letter-spacing:.1em;color:#a47988;margin-top:24px}
.again{margin-top:28px;background:transparent;color:#9a536d;font-size:14px;text-decoration:underline;text-underline-offset:5px}
.confetti{position:fixed;top:-40px;left:var(--x);font-size:var(--s);pointer-events:none;animation:fall var(--d) linear forwards;z-index:3}
[hidden]{display:none!important}@keyframes bob{50%{transform:translateY(-7px) rotate(-3deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(300deg);opacity:0}}
@media(max-width:380px){.card{padding:32px 18px 24px}.character{font-size:84px}.buttons{gap:12px}button{padding:14px 24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.confetti{display:none}}
</style>
</head>
<body>
<main>
<p class="eyebrow">A LITTLE QUESTION, A LOT OF LOVE</p>
<section class="card" aria-labelledby="question">
<span class="stamp" aria-hidden="true">♡</span>
<div id="ask">
<span class="character" role="img" aria-label="수줍은 곰">🧸</span>
<h1 id="question">나랑 데이트할래?</h1>
<p class="subtitle">조금 떨리지만, 용기 내서 물어볼게.</p>
<div class="buttons"><button id="yes" type="button">Yes 💗</button><button id="no" type="button">No</button></div>
<p class="note" id="note" aria-live="polite">너의 대답을 기다리는 중…</p>
</div>
<div id="success" hidden>
<span class="character" role="img" aria-label="사랑이 담긴 편지">💌</span>
<h1 id="result" tabindex="-1">오늘부터 설레도 돼?</h1>
<p class="subtitle">좋아! 우리 곧 만나자.<br>벌써부터 그날이 기다려져.</p>
<button type="button" class="again" id="again">한 번 더 보기</button>
</div>
</section>
<footer>JUST FOR YOU · WITH LOVE</footer>
</main>
<script>
const yes=document.querySelector('#yes'),no=document.querySelector('#no'),note=document.querySelector('#note');
const ask=document.querySelector('#ask'),success=document.querySelector('#success'),card=document.querySelector('.card');
let count=0;
const messages=['정말? 한 번만 더 생각해 줄래? 🥺','맛있는 것도 같이 먹자! 🍰','내 마음은 점점 커지는 중… 💗','그래도 네 마음을 존중할게.'];
no.addEventListener('click',()=>{
 count=Math.min(count+1,4);
 note.textContent=messages[count-1];
 yes.style.fontSize=(20+count*7)+'px';
 yes.style.padding=(15+count*3)+'px '+(30+count*4)+'px';
 no.textContent=count<4?'다시 생각할래':'마음만 받을게';
 if(count===4){note.textContent='괜찮아. 솔직하게 말해 줘서 고마워 🌷';}
});
yes.addEventListener('click',()=>{
 ask.hidden=true;success.hidden=false;card.setAttribute('aria-labelledby','result');document.querySelector('#result').focus();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
 for(let i=0;i<32;i++){
 const heart=document.createElement('span');heart.className='confetti';heart.textContent=['💗','♡','💕','✨'][i%4];heart.setAttribute('aria-hidden','true');
 heart.style.setProperty('--x',Math.random()*96+'vw');heart.style.setProperty('--s',16+Math.random()*16+'px');heart.style.setProperty('--d',2.5+Math.random()*2+'s');
 document.body.append(heart);setTimeout(()=>heart.remove(),5000);
 }}
});
document.querySelector('#again').addEventListener('click',()=>{
 count=0;ask.hidden=false;success.hidden=true;card.setAttribute('aria-labelledby','question');yes.style.fontSize='';yes.style.padding='';no.textContent='No';note.textContent='너의 대답을 기다리는 중…';document.querySelectorAll('.confetti').forEach(el=>el.remove());yes.focus();
});
</script>
</body></html>
