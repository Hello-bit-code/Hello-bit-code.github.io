<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff8f2">
<title>오늘 뭐 할까? · 랜덤 돌림판</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#fff8f2;color:#342b44;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;display:grid;place-items:center;padding:28px 18px}main{width:min(100%,480px);text-align:center}.eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;color:#98788c}h1{font-size:clamp(30px,8vw,42px);letter-spacing:-2px;margin:14px 0 10px}.intro{color:#847383;font-size:15px;margin:0 0 28px}.stage{position:relative;width:min(100%,380px);margin:auto;filter:drop-shadow(0 15px 20px #58384b18)}.pointer{position:absolute;z-index:2;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:31px solid #392b49}.wheel{display:block;width:100%;border:8px solid white;border-radius:50%;background:white;will-change:transform}.wheel text{font-size:19px;font-weight:750;fill:#382e46}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;display:grid;place-items:center;background:white;border-radius:50%;box-shadow:0 3px 12px #352a441f;font-size:25px}.result{min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:7px;margin:23px 0 10px}.result small{font-size:13px;color:#8b7788}.result strong{font-size:25px;letter-spacing:-1px}button{border:0;border-radius:18px;width:100%;padding:19px;font:750 18px system-ui;color:white;background:#7054a1;box-shadow:0 7px 0 #523d78;cursor:pointer;transition:background .2s,transform .2s}button:hover:not(:disabled){background:#60428f}button:active:not(:disabled){transform:translateY(3px);box-shadow:0 4px 0 #523d78}button:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:3px solid #342b44;outline-offset:5px}.note{font-size:12px;color:#94818f;margin:22px 0 0}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}.choices span{padding:7px 10px;border-radius:20px;font-size:12px;background:#fff;border:1px solid #efe3e9}
</style>
</head>
<body>
<main>
<div class="eyebrow">A LITTLE CHANCE</div>
<h1>오늘 뭐 할까?</h1>
<p class="intro">고민은 잠깐 내려놓고, 돌려보세요.</p>
<div class="stage">
<div class="pointer" aria-hidden="true"></div>
<svg class="wheel" id="wheel" viewBox="0 0 360 360" role="img" aria-label="동일한 크기의 세 칸: 약속 가기, 약속 파토내기, 오빠 보러가기">
<path d="M180 180 L180 0 A180 180 0 0 1 335.8846 270 Z" fill="#ffd2df"/>
<path d="M180 180 L335.8846 270 A180 180 0 0 1 24.1154 270 Z" fill="#dacdf5"/>
<path d="M180 180 L24.1154 270 A180 180 0 0 1 180 0 Z" fill="#ffe2ab"/>
<g text-anchor="middle"><text x="180" y="77" transform="rotate(60 180 180)">약속 가기</text><text x="180" y="77" transform="rotate(180 180 180)">약속 파토내기</text><text x="180" y="77" transform="rotate(300 180 180)">오빠 보러가기</text></g>
</svg>
<div class="hub" aria-hidden="true">✦</div>
</div>
<div class="result" role="status" aria-live="polite" aria-atomic="true"><small id="caption">어떤 선택이 나올까요?</small><strong id="result">오늘의 선택은…</strong></div>
<button id="spin" type="button">돌림판 돌리기 ↻</button>
<p class="note">세 항목 모두 같은 확률 · 매번 독립적인 랜덤 추첨</p>
<div class="choices" aria-hidden="true"><span>약속 가기</span><span>약속 파토내기</span><span>오빠 보러가기</span></div>
</main>
<script>
'use strict';
const items=['약속 가기','약속 파토내기','오빠 보러가기'];
const wheel=document.getElementById('wheel');
const button=document.getElementById('spin');
const result=document.getElementById('result');
const caption=document.getElementById('caption');
let rotation=0;
let spinning=false;
// Reject the last uint32 value so all three outcomes have exactly equal probability.
function randomIndex(){const value=new Uint32Array(1);do{crypto.getRandomValues(value);}while(value[0]>=4294967295);return value[0]%3;}
button.addEventListener('click',async()=>{
 if(spinning)return;
 spinning=true;button.disabled=true;
 const selected=randomIndex();
 const target=(360-(selected*120+60))%360;
 const next=rotation+360*6+(target-rotation%360+360)%360;
 caption.textContent='두근두근, 돌리는 중';result.textContent='오늘의 운명을 고르는 중…';
 button.textContent='돌아가는 중…';
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 try{
  if(!reduced && typeof wheel.animate==='function'){
   const animation=wheel.animate([{transform:`rotate(${rotation}deg)`},{transform:`rotate(${next}deg)`}],{duration:4200,easing:'cubic-bezier(.12,.68,.16,1)',fill:'forwards'});
   await animation.finished;
   wheel.style.transform=`rotate(${target}deg)`;
   animation.cancel();
  }else{wheel.style.transform=`rotate(${target}deg)`;}
 }finally{
  rotation=target;wheel.style.transform=`rotate(${target}deg)`;
  caption.textContent='오늘의 랜덤 선택';result.textContent=items[selected];
  button.textContent='한 번 더 돌리기 ↻';button.disabled=false;spinning=false;
 }
});
</script>
</body>
</html>
