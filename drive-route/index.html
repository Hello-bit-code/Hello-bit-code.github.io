<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>길모아 · 자동차 경로 플래너</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;color:#172e29;background:#f7f9f7;font:16px/1.55 system-ui,"Malgun Gothic",sans-serif}header{height:68px;background:#123d34;color:white;display:flex;align-items:center;gap:13px;padding:0 26px}header strong{font-size:25px;letter-spacing:-2px}header small{border-left:1px solid #688b80;padding-left:14px;color:#d5e5da}.brand{width:32px;height:32px}main{display:grid;grid-template-columns:minmax(330px,395px) 1fr;height:calc(100dvh - 68px)}aside{overflow:auto;padding:26px;background:white;border-right:1px solid #d6e2dc}h1{font-size:26px;margin:0 0 18px;letter-spacing:-1px}h2{font-size:17px;margin:22px 0 8px}button,input{font:inherit}button{cursor:pointer;border:1px solid #cddbd3;background:#fff;border-radius:9px;color:inherit;padding:8px 12px}button:disabled{opacity:.6;cursor:wait}fieldset{margin:0;padding:0;border:0}.mode,.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{background:#edf2ee;padding:4px;border-radius:12px}.mode label{text-align:center;border-radius:8px;padding:6px;cursor:pointer}.mode label:has(:checked){background:#fff;color:#116443;box-shadow:0 1px 5px #13382822;font-weight:700}.mode input{accent-color:#147451}.row{display:flex;gap:7px;align-items:center;margin-bottom:10px}.row label{font-weight:650;font-size:14px;min-width:47px;color:#305d50}.row input{width:100%;min-width:0;border-radius:9px;border:1px solid #c9d7cf;padding:10px}.row button{padding:8px;color:#815245}.add,.go{width:100%;font-weight:700}.add{border-style:dashed;color:#17644c}.go{background:#146647;color:white;border:0;margin-top:16px;padding:13px}.filters label{border:1px solid #d6dfda;border-radius:9px;padding:8px;cursor:pointer}.filters input{accent-color:#146647}.meta,small{font-size:13px;color:#52685e}.meta{margin:8px 0}.smallhead{display:flex;justify-content:space-between;align-items:baseline}.smallhead span{font-size:14px;color:#547063}#map{height:100%;background:#e8efe8}.mapbox{position:relative;min-width:0}.fit{position:absolute;right:12px;top:12px;z-index:450;box-shadow:0 2px 8px #173a2524}.pin{background:#155d45;color:white;border:2px solid white;border-radius:20px;min-width:32px;text-align:center;font-weight:bold;box-shadow:0 2px 6px #24382f55}.result{background:#edf5ed;border-radius:10px;padding:12px;margin-top:14px}.result:empty,#places:empty{display:none}#places button,dialog button{display:block;width:100%;text-align:left;margin:6px 0}dialog{border:1px solid #c5d1c7;border-radius:14px;max-width:min(460px,94vw)}dialog::backdrop{background:#132d2580}ol{padding-left:24px}.status{color:#815024;margin-top:7px;font-size:14px}.leaflet-container{font-family:inherit}details{margin-top:8px}summary{cursor:pointer}:focus-visible{outline:3px solid #dd970c;outline-offset:2px}@media(max-width:760px){main{display:flex;flex-direction:column;height:auto}.mapbox{order:-1;height:34dvh;min-height:220px}aside{overflow:visible;padding:20px}header{height:54px;padding:0 18px}}
</style></head><body>
<header><svg class="brand" viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#cef284"/><path d="M10 29v-6q0-5 5-5h10q5 0 5-6" stroke="#164f38" stroke-width="4"/><circle cx="10" cy="29" r="3" fill="#164f38"/><circle cx="30" cy="10" r="4" fill="#164f38"/></svg><strong>길모아</strong><small>자동차 경로 플래너</small></header>
<main><aside><h1>경로 만들기</h1><form id="planner"><fieldset id="controls"><div class="mode"><label><input type="radio" name="mode" value="one" checked> 편도</label><label><input type="radio" name="mode" value="round"> 왕복</label></div><div class="smallhead"><h2>방문 순서</h2><span id="count"></span></div><div id="rows"></div><button type="button" id="add" class="add">＋ 경유지 추가</button><p class="meta" id="hint">국내 장소명, 주소 또는 위도·경도를 입력하세요.</p>
<h2>가는 길 주변 시설</h2><div id="filters" class="filters"></div><p class="meta">경로 양옆 약 500m 이내의 등록 시설을 찾습니다.</p><button id="go" class="go">자동차 경로 찾기</button><details class="meta"><summary>검색 시 전송되는 정보</summary>장소명은 Nominatim, 경로 좌표는 OSRM, 선택한 시설 종류와 경로 좌표는 Overpass로 전송됩니다. 지도는 OpenStreetMap을 사용합니다.</details></fieldset></form>
<div id="status" class="status" role="status"></div><div id="result" class="result" aria-live="polite"></div><div id="places" aria-live="polite"></div></aside><section class="mapbox" aria-label="주행 경로 지도"><div id="map"></div><button class="fit" id="fit" hidden>전체 경로 보기</button></section></main>
<dialog id="choices"><h2>검색한 장소를 선택하세요</h2><div id="options"></div><button id="cancel">취소</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';
const el=id=>document.getElementById(id), make=tag=>document.createElement(tag);
const types=[['주유소','amenity','fuel','#bb5738'],['화장실','amenity','toilets','#386fc0'],['편의점','shop','convenience','#9462ad'],['휴게실·휴게소','highway','services|rest_area','#318065']];
let map,routeLayer,facilityLayer,current=null,facilityRun=0,lastSearch=0;
const cache=new Map();
if(window.L){
 map=L.map('map').setView([36.45,127.75],7);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
 routeLayer=L.layerGroup().addTo(map);facilityLayer=L.layerGroup().addTo(map);
}else el('map').textContent='지도 모듈을 불러오지 못했습니다. 인터넷 연결을 확인한 후 새로고침하세요.';
function invalidate(){facilityRun++;current=null;routeLayer?.clearLayers();facilityLayer?.clearLayers();el('fit').hidden=true;for(const id of ['result','places','status'])el(id).replaceChildren()}
function labels(){const rows=[...el('rows').children];rows.forEach((row,i)=>{row.firstChild.textContent=i===0?'출발지':i===rows.length-1?'도착지':'경유 '+i});el('count').textContent='경유지 '+(rows.length-2)+'개'}
let serial=0;
function row(stop=false){const group=make('div'),label=make('label'),input=make('input');group.className='row';input.id='point'+(++serial);label.htmlFor=input.id;input.required=true;input.placeholder='주소 또는 장소명';input.addEventListener('input',invalidate);group.append(label,input);
 if(stop){const del=make('button');del.type='button';del.textContent='×';del.ariaLabel='이 경유지 삭제';del.onclick=()=>{group.remove();labels();invalidate()};group.append(del);el('rows').insertBefore(group,el('rows').lastChild)}else el('rows').append(group);return input}
row();row();labels();el('add').onclick=()=>{const input=row(true);labels();invalidate();input.focus()};
document.querySelectorAll('[name=mode]').forEach(r=>r.onchange=()=>{invalidate();el('hint').textContent=r.value==='round'?'도착지 방문 후 출발지로 바로 복귀합니다.':'국내 장소명, 주소 또는 위도·경도를 입력하세요.'});
types.forEach(([name],i)=>{const label=make('label'),input=make('input');input.type='checkbox';input.value=i;input.onchange=()=>{if(current)facilities()};label.append(input,' '+name);el('filters').append(label)});
async function json(url,options={}){const r=await fetch(url,{...options,signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('검색 서비스 응답 오류 ('+r.status+'). 잠시 후 다시 시도하세요.');return r.json()}
function choose(matches){return new Promise(resolve=>{const dialog=el('choices');let choice=null;el('options').replaceChildren();for(const m of matches){const b=make('button');b.textContent=m.display_name;b.onclick=()=>{choice=m;dialog.close()};el('options').append(b)}el('cancel').onclick=()=>dialog.close();dialog.onclose=()=>resolve(choice);dialog.showModal()})}
async function locate(q){if(cache.has(q))return cache.get(q);const pair=q.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);if(pair){const lat=Number(pair[1]),lon=Number(pair[2]);if(Math.abs(lat)>85||Math.abs(lon)>180)throw Error('위도·경도 범위를 확인하세요.');return [lat,lon]}
 await new Promise(r=>setTimeout(r,Math.max(0,1100-(Date.now()-lastSearch))));lastSearch=Date.now();
 const matches=await json('https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=kr&accept-language=ko&limit=5&q='+encodeURIComponent(q));if(!matches.length)throw Error('“'+q+'” 검색 결과가 없습니다. 시·군·구를 함께 입력하거나 위도, 경도를 입력하세요.');const m=matches.length===1?matches[0]:await choose(matches);if(!m)throw Error('장소 선택을 취소했습니다.');const p=[+m.lat,+m.lon];cache.set(q,p);return p}
function duration(sec){const mins=Math.max(1,Math.round(sec/60));return (mins>=60?Math.floor(mins/60)+'시간 ':'')+(mins%60||mins<60?mins%60+'분':'')}
function fit(){if(map&&current)map.fitBounds(current.line,{padding:[32,32],maxZoom:16})}el('fit').onclick=fit;
el('planner').onsubmit=async e=>{e.preventDefault();invalidate();el('controls').disabled=true;try{
 const names=[...el('rows').querySelectorAll('input')].map(i=>i.value.trim());const points=[];for(const name of names){if(!name)throw Error('빈 장소를 입력하세요.');el('status').textContent=name+' 위치 검색 중…';points.push(await locate(name))}
 const round=document.querySelector('[name=mode]:checked').value==='round';if(round){points.push(points[0]);names.push(names[0])}
 el('status').textContent='도로 경로 계산 중…';let distance=0,time=0;const line=[],legs=[];
 for(let i=0;i<points.length-1;i+=20){const coords=points.slice(i,i+21).map(([lat,lon])=>lon+','+lat).join(';');const data=await json('https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson');const route=data.routes?.[0];if(!route)throw Error('연결 가능한 자동차 경로가 없습니다. 장소 위치를 확인하세요.');distance+=route.distance;time+=route.duration;legs.push(...route.legs);for(const [x,y] of route.geometry.coordinates)line.push([y,x])}
 current={line};if(map){L.polyline(line,{color:'#16744e',weight:6,opacity:.9}).addTo(routeLayer);points.slice(0,round?-1:undefined).forEach((p,i)=>{const marker=L.marker(p,{icon:L.divIcon({className:'pin',html:i===0?'출발':i===points.length-(round?2:1)?'도착':String(i),iconSize:[34,24],iconAnchor:[17,12]})}).addTo(routeLayer);const name=make('strong');name.textContent=names[i];marker.bindPopup(name)});fit();el('fit').hidden=false}
 const strong=make('strong');strong.textContent=(round?'왕복':'편도')+' · '+(distance/1000).toFixed(1)+' km · 약 '+duration(time);const details=make('details'),summary=make('summary'),list=make('ol');summary.textContent='구간별 거리와 시간';legs.forEach((leg,i)=>{const li=make('li');li.textContent=names[i]+' → '+names[i+1]+' · '+(leg.distance/1000).toFixed(1)+' km · '+duration(leg.duration);list.append(li)});details.append(summary,list);el('result').append(strong,details);el('status').textContent='실시간 교통을 반영하지 않은 예상 시간입니다.';facilities()
 }catch(err){el('status').textContent=err instanceof TypeError?'검색 서비스 연결에 실패했습니다. 인터넷 연결을 확인하고 다시 시도하세요.':err.message}finally{el('controls').disabled=false}};
function thin(line){const kept=[line[0]];for(const p of line.slice(1,-1)){const a=kept.at(-1);if(Math.hypot((a[0]-p[0])*111000,(a[1]-p[1])*111000*Math.cos(p[0]*Math.PI/180))>=65)kept.push(p)}kept.push(line.at(-1));return kept}
function nearRoad(lat,lon,line){
 const scale=111200*Math.cos(lat*Math.PI/180);
 for(let j=1;j<line.length;j++){
  const [a,b]=line[j-1],[c,d]=line[j];
  const x=(b-lon)*scale,y=(a-lat)*111200,dx=(d-b)*scale,dy=(c-a)*111200;
  const f=Math.min(1,Math.max(0,-(x*dx+y*dy)/(dx*dx+dy*dy||1)));
  if(Math.hypot(x+f*dx,y+f*dy)<=500)return true;
 }
 return false;
}
async function facilities(){const token=++facilityRun;const target=el('places');target.replaceChildren();facilityLayer?.clearLayers();const selected=[...el('filters').querySelectorAll(':checked')].map(i=>types[+i.value]);if(!selected.length||!current)return;
 target.textContent='경로 주변 시설 검색 중…';const pts=thin(current.line),seen=new Set(),items=[];try{for(let i=0;i<pts.length-1;i+=400){const segment=pts.slice(i,i+401), lat=segment.map(p=>p[0]),lon=segment.map(p=>p[1]);
 const box=[Math.min(...lat)-.005,Math.min(...lon)-.007,Math.max(...lat)+.005,Math.max(...lon)+.007].map(x=>x.toFixed(5)).join(',');
 const clauses=selected.map(([,key,val])=>'nwr["'+key+'"~"^('+val+')$"]('+box+');').join('');
 const query='[out:json][timeout:30];('+clauses+');out center;';
 const data=await json('https://overpass-api.de/api/interpreter?'+new URLSearchParams({data:query}));if(token!==facilityRun)return;if(data.remark)throw Error('요청 시간 초과');for(const v of data.elements){const id=v.type+v.id;if(seen.has(id))continue;const p=v.center||v;if(!nearRoad(p.lat,p.lon,segment))continue;seen.add(id);const t=selected.find(([,k,val])=>val.split('|').includes(v.tags?.[k]));if(t&&Number.isFinite(p.lat))items.push({p:[p.lat,p.lon],t,name:v.tags['name:ko']||v.tags.name||t[0]})}}
 target.replaceChildren();const head=make('h2');head.textContent='주변 시설 '+items.length+'곳';target.append(head);if(!items.length)target.append('등록된 시설을 찾지 못했습니다.');const list=make('details'),summary=make('summary');summary.textContent='시설 목록';list.append(summary);if(items.length)target.append(list);
 for(const {p,t,name} of items){const label=make('span');label.textContent=t[0]+' · '+name;const marker=map?L.circleMarker(p,{radius:7,color:'#fff',weight:2,fillColor:t[3],fillOpacity:1}).addTo(facilityLayer).bindPopup(label):null;const b=make('button');b.textContent=label.textContent;b.onclick=()=>{if(marker){map.setView(p,16);marker.openPopup();el('map').scrollIntoView({block:'nearest'})}};list.append(b)}
 }catch{if(token!==facilityRun)return;target.textContent='시설 조회에 실패했습니다. ';const retry=make('button');retry.textContent='시설 다시 찾기';retry.onclick=facilities;target.append(retry)}}
</script></body></html>
